[package]
name = "pulse"
version = "0.1.0"
description = "A fast, lightweight, beautiful music player"
edition = "2021"

[lib]
name = "pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ureq = "2"

# Taskbar hover buttons (Start again / Previous / Play / Next / Stop). Windows only, and only when
# built with `--features taskbar` (the GitHub build file does that, and falls back to a plain build).
[features]
taskbar = ["dep:windows"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Small, fast binary. Every megabyte counts on a low-end PC.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
