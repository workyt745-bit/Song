name: Build Pulse for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - name: Build with taskbar buttons
        id: full
        continue-on-error: true
        shell: bash
        run: npm run tauri build -- --features taskbar
      - name: Build without taskbar buttons (only if the first build failed)
        if: steps.full.outcome == 'failure'
        shell: bash
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
