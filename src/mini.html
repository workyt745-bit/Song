<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse mini</title>
<link rel="stylesheet" href="mini.css">
</head>
<body>
<main id="bar" data-tauri-drag-region>
  <div id="cover" data-tauri-drag-region><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="18" r="2.4" fill="currentColor"/><circle cx="17" cy="16" r="2.4" fill="currentColor"/></svg><img alt="" hidden></div>
  <div id="info" data-tauri-drag-region>
    <div id="title" data-tauri-drag-region>Nothing playing</div>
    <div id="artist" data-tauri-drag-region>Open Pulse and pick a song</div>
  </div>
  <div id="btns">
    <button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M7 5v14M19 5L9 12l10 7z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
    <button id="toggle" class="main" aria-label="Play"><svg viewBox="0 0 24 24"><path id="pl" d="M8 5l11 7-11 7z" fill="currentColor"/><path id="pa" d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" style="display:none"/></svg></button>
    <button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M17 5v14M5 5l10 7L5 19z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
  </div>
  <button id="expand" aria-label="Back to Pulse" title="Back to Pulse"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8M10 20H4v-6M4 20l8-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div id="prog"><i></i></div>
</main>
<script src="js/mini.js"></script>
</body>
</html>
