<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Icons: one sprite, referenced with <use>. Nothing else to download. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.2" height="15" rx="1.4" fill="currentColor"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.4" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 5.6v12.8a.9.9 0 0 1-1.4.75L8.6 12.8a.9.9 0 0 1 0-1.5l8-5.35A.9.9 0 0 1 18 5.6z" fill="currentColor"/><rect x="5" y="5" width="2.4" height="14" rx="1.2" fill="currentColor"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 5.6v12.8a.9.9 0 0 0 1.4.75l8-5.35a.9.9 0 0 0 0-1.5l-8-5.35A.9.9 0 0 0 6 5.6z" fill="currentColor"/><rect x="16.6" y="5" width="2.4" height="14" rx="1.2" fill="currentColor"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h4v4"/><path d="M4 20 20 4"/><path d="M20 16v4h-4"/><path d="m15 15 5 5"/><path d="M4 4l5 5"/></g></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></g></symbol>
    <symbol id="i-repeat1" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></g></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.4s-7.6-4.6-9.2-9.6C1.8 7.5 3.8 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.2 0 5.2 3 4.2 6.3-1.6 5-9.2 9.6-9.2 9.6z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M12 20.4s-7.6-4.6-9.2-9.6C1.8 7.5 3.8 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.2 0 5.2 3 4.2 6.3-1.6 5-9.2 9.6-9.2 9.6z" fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3l5-4v13l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></g></symbol>
    <symbol id="i-vol-low" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3l5-4v13l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6"/></g></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3l5-4v13l-5-4H4z" fill="currentColor"/><path d="m16 9.5 5 5"/><path d="m21 9.5-5 5"/></g></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12"/><path d="M4 12h12"/><path d="M4 18h7"/><path d="M19 14v6l-4-3z" fill="currentColor"/></g></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></g></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h4v-5h4v5h4v-9"/></g></symbol>
    <symbol id="i-songs" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></g></symbol>
    <symbol id="i-album" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.4"/></g></symbol>
    <symbol id="i-artist" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.4 7-5.4s6.2 1.8 7 5.4"/></g></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></g></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7.5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7.5z"/><path d="M14 3v4.5h4.5"/><path d="M10.5 16.5v-5l4-.8v5"/><circle cx="9.3" cy="16.6" r="1.2"/><circle cx="13.3" cy="15.8" r="1.2"/></g></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19.5h14"/></g></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></g></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></g></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></g></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></g></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></g></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chev-down" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M10 20H4v-6"/><path d="m20 4-7 7"/><path d="m4 20 7-7"/></g></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></g></symbol>
    <symbol id="i-lyrics" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 11h10M4 16h13M4 21h7"/></g></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 4v7M5 15v5M12 4v2M12 10v10M19 4v9M19 17v3"/><circle cx="5" cy="13" r="2"/><circle cx="12" cy="8" r="2"/><circle cx="19" cy="15" r="2"/></g></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-5"/></g></symbol>
    <symbol id="i-mini" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><rect x="11" y="12" width="7" height="5" rx="1.2" fill="currentColor" stroke="none"/></g></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 12a7.8 7.8 0 1 0 2.4-5.6"/><path d="M4.4 3.6v4.8h4.8"/></g></symbol>
    <symbol id="i-min" viewBox="0 0 24 24"><path d="M6 12h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-max" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="5.5" y="9" width="9.5" height="9.5" rx="1.4"/><path d="M9 9V7.4A1.4 1.4 0 0 1 10.4 6H16.6A1.4 1.4 0 0 1 18 7.4V13.6A1.4 1.4 0 0 1 16.6 15H15"/></g></symbol>
  </defs>
</svg>

<div id="app">
  <!-- Title bar: draggable, holds search and window buttons -->
  <header id="titlebar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="brand-name" data-tauri-drag-region>Pulse</span>
    </div>
    <label class="search" id="search-box">
      <svg class="ico"><use href="#i-search"/></svg>
      <input id="search" type="text" placeholder="What do you want to hear?" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </label>
    <div class="tb-right">
      <button id="add-music" class="add-music"><svg class="ico"><use href="#i-plus"/></svg>Add music</button>
      <button id="manage-folders" class="icon-btn" title="Manage library" aria-label="Manage library"><svg class="ico"><use href="#i-folder"/></svg></button>
    </div>
    <div class="winctl">
      <button id="w-min" aria-label="Minimize"><svg class="ico"><use href="#i-min"/></svg></button>
      <button id="w-max" aria-label="Maximize"><svg class="ico"><use href="#i-max"/></svg></button>
      <button id="w-close" class="close" aria-label="Close"><svg class="ico"><use href="#i-close"/></svg></button>
    </div>
  </header>

  <nav id="topnav" aria-label="Sections">
    <div class="tabs" id="tabs">
      <button class="tab" data-view="home"><svg class="ico"><use href="#i-home"/></svg>Home</button>
      <button class="tab" data-view="playing"><svg class="ico"><use href="#i-wave"/></svg>Now playing</button>
      <button class="tab" data-view="lyrics"><svg class="ico"><use href="#i-lyrics"/></svg>Lyrics</button>
      <span class="tab-sep" aria-hidden="true"></span>
      <button class="tab" data-view="songs"><svg class="ico"><use href="#i-songs"/></svg>Songs<span class="count" id="c-songs"></span></button>
      <button class="tab" data-view="albums"><svg class="ico"><use href="#i-album"/></svg>Albums<span class="count" id="c-albums"></span></button>
      <button class="tab" data-view="artists"><svg class="ico"><use href="#i-artist"/></svg>Artists<span class="count" id="c-artists"></span></button>
      <button class="tab" data-view="liked"><svg class="ico"><use href="#i-heart"/></svg>Liked<span class="count" id="c-liked"></span></button>
      <button class="tab" data-view="playlists"><svg class="ico"><use href="#i-list"/></svg>Playlists<span class="count" id="c-playlists"></span></button>
      <button class="tab" data-view="stats"><svg class="ico"><use href="#i-chart"/></svg>Stats</button>
    </div>
    <div id="scan-status" class="scan" hidden>
      <div class="scan-text" id="scan-text"></div>
      <div class="scan-bar"><i id="scan-fill"></i></div>
    </div>
  </nav>

  <main id="main" class="panel">
    <div class="glow" aria-hidden="true"></div>
    <div id="view" class="view"></div>
  </main>

  <aside id="queue-panel" class="panel" aria-label="Queue" hidden>
    <div class="q-head">
      <h2>Queue</h2>
      <div>
        <button id="q-clear" class="text-btn">Clear</button>
        <button id="q-close" class="icon-btn small" aria-label="Close queue"><svg class="ico"><use href="#i-close"/></svg></button>
      </div>
    </div>
    <div id="q-list" class="scroller"></div>
  </aside>

  <footer id="player" class="panel">
    <div class="np">
      <button class="np-cover" id="np-cover" aria-label="Open full screen player" title="Open full screen player">
        <span class="np-expand"><svg class="ico"><use href="#i-expand"/></svg></span>
      </button>
      <div class="np-text">
        <button class="np-title" id="np-title">Nothing playing</button>
        <button class="np-artist" id="np-artist">Pick a song to start</button>
      </div>
      <button class="icon-btn like js-like" aria-label="Like"><svg class="ico"><use href="#i-heart"/></svg></button>
      <span class="np-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    </div>

    <div class="transport">
      <div class="controls">
        <button class="icon-btn toggle js-shuffle" aria-label="Shuffle" title="Shuffle (S)"><svg class="ico"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn js-prev" aria-label="Previous" title="Previous (Ctrl + Left)"><svg class="ico"><use href="#i-prev"/></svg></button>
        <button class="play-btn js-play" aria-label="Play" title="Play / pause (Space)"><svg class="ico"><use href="#i-play"/></svg></button>
        <button class="icon-btn js-next" aria-label="Next" title="Next (Ctrl + Right)"><svg class="ico"><use href="#i-next"/></svg></button>
        <button class="icon-btn toggle js-repeat" aria-label="Repeat" title="Repeat (R)"><svg class="ico"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="scrub-row">
        <span class="time t-cur">0:00</span>
        <div class="wave" data-wave role="slider" aria-label="Seek" tabindex="0"></div>
        <span class="time t-dur">0:00</span>
      </div>
    </div>

    <div class="extras">
      <button class="icon-btn js-restart" aria-label="Start song again" title="Start song again (Home)"><svg class="ico"><use href="#i-restart"/></svg></button>
      <button id="b-mini" class="icon-btn" aria-label="Mini player" title="Mini player"><svg class="ico"><use href="#i-mini"/></svg></button>
      <button id="b-sound" class="icon-btn" aria-label="Sound: equalizer, leveling, crossfade" title="Sound"><svg class="ico"><use href="#i-sliders"/></svg></button>
      <button id="b-queue" class="icon-btn toggle" aria-label="Queue" title="Queue (Q)"><svg class="ico"><use href="#i-queue"/></svg></button>
      <button class="icon-btn js-mute" aria-label="Mute" title="Mute (M)"><svg class="ico"><use href="#i-vol"/></svg></button>
      <input class="range js-vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </div>
  </footer>
</div>

<!-- Full screen Now Playing -->
<section id="nowplaying" aria-label="Now playing" hidden>
  <div class="npv-bg" aria-hidden="true"></div>
  <button id="npv-close" class="icon-btn" aria-label="Close full screen player" title="Close (Esc)"><svg class="ico"><use href="#i-chev-down"/></svg></button>
  <div class="npv-body">
    <div class="npv-art"><div class="npv-cover" id="npv-cover"></div></div>
    <div class="npv-side">
      <div class="npv-meta">
        <h1 id="npv-title">Nothing playing</h1>
        <button id="npv-artist" class="npv-artist"></button>
        <div id="npv-album" class="npv-album"></div>
      </div>
      <div class="scrub-row big">
        <span class="time t-cur">0:00</span>
        <div class="wave" data-wave data-big role="slider" aria-label="Seek" tabindex="0"></div>
        <span class="time t-dur">0:00</span>
      </div>
      <div class="controls big">
        <button class="icon-btn toggle js-shuffle" aria-label="Shuffle"><svg class="ico"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn js-prev" aria-label="Previous"><svg class="ico"><use href="#i-prev"/></svg></button>
        <button class="play-btn js-play" aria-label="Play"><svg class="ico"><use href="#i-play"/></svg></button>
        <button class="icon-btn js-next" aria-label="Next"><svg class="ico"><use href="#i-next"/></svg></button>
        <button class="icon-btn toggle js-repeat" aria-label="Repeat"><svg class="ico"><use href="#i-repeat"/></svg></button>
        <button class="icon-btn js-restart" aria-label="Start song again" title="Start song again"><svg class="ico"><use href="#i-restart"/></svg></button>
      </div>
      <div class="npv-row">
        <button class="icon-btn like js-like" aria-label="Like"><svg class="ico"><use href="#i-heart"/></svg></button>
        <div class="npv-vol">
          <button class="icon-btn js-mute" aria-label="Mute"><svg class="ico"><use href="#i-vol"/></svg></button>
          <input class="range js-vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
        </div>
      </div>
      <div class="npv-next" id="npv-next"></div>
    </div>
  </div>
</section>

<div id="dropzone" hidden>
  <div class="drop-card">
    <div class="drop-ico"><svg class="ico"><use href="#i-drop"/></svg></div>
    <h2>Drop to add to your library</h2>
    <p>Songs, many songs at once, or whole folders</p>
  </div>
</div>

<div id="menu" class="menu" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="js/core.js"></script>
<script src="js/player.js"></script>
<script src="js/views.js"></script>
<script src="js/fx.js"></script>
<script src="js/smart.js"></script>
<script src="js/playing.js"></script>
<script src="js/lyrics.js"></script>
<script src="js/dnd.js"></script>
<script src="js/browser.js"></script>
<script src="js/main.js"></script>
</body>
</html>
